[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "gemwalk"
version = "0.2.0"
description = "Landfill gas collection and control: wellfield monitoring, exceedance clocks and surface emissions walkovers"
requires-python = ">=3.12"
dependencies = ["click==8.1.8"]

[project.optional-dependencies]
dev = [
  "pytest==8.3.4",
  "pytest-cov==6.0.0",
  "coverage==7.6.10",
  "ruff==0.9.2",
  "mypy==1.14.1",
]

[project.scripts]
gemwalk = "gemwalk.cli.main:run"

[tool.hatch.build.targets.sdist]
include = [
  "src",
  "tests",
  "docs",
  "README.md",
  "CHANGELOG.md",
  "constraints.txt",
  "check.sh",
  "migrations.lock",
]

[tool.hatch.build.targets.wheel]
packages = ["src/gemwalk"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "W", "F", "I", "B", "C4", "UP", "SIM", "RET", "ARG", "N", "PT",
  "A", "BLE", "C90", "DTZ", "ISC", "PIE", "RSE", "RUF", "TID",
]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001", "ARG002"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["src", "tests"]

[tool.coverage.run]
branch = true
source = ["src/gemwalk"]

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]
markers = [
  "repo: asserts the state of this checkout rather than the behaviour of the package",
]
addopts = "-m 'not repo'"
